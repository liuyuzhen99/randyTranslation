<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1280" viewBox="0 0 1500 1280" role="img" aria-labelledby="title desc">
  <title id="title">Job and Pipeline Stage State Flow</title>
  <desc id="desc">State transitions for Job and PipelineStageExecution across the randyTranslation Phase 6 async pipeline.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#334155" />
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #d8dee9; stroke-width: 1.3; rx: 18; ry: 18; }
      .title { font: 800 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .sectionTitle { font: 800 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .state { filter: url(#shadow); stroke-width: 1.5; rx: 12; ry: 12; }
      .stateTitle { font: 800 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .stateText { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .softArrow { fill: none; stroke: #64748b; stroke-width: 1.9; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .label { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .note { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.2; rx: 10; ry: 10; }
      .noteText { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #92400e; }
      .legendText { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="1280" />
  <text class="title" x="70" y="60">Job and Pipeline Stage State Flow</text>
  <text class="subtitle" x="70" y="90">How Job.status, Job.current_stage, PipelineStageExecution.status, review gates, retry, and DLQ move through the Phase 6 runtime.</text>

  <!-- Panels -->
  <rect class="panel" x="60" y="130" width="410" height="1030" />
  <text class="sectionTitle" x="90" y="170">Job state</text>
  <text class="subtitle" x="90" y="195">One row per overall processing task</text>

  <rect class="panel" x="510" y="130" width="470" height="1030" />
  <text class="sectionTitle" x="540" y="170">Stage execution state</text>
  <text class="subtitle" x="540" y="195">One row per job + stage + attempt</text>

  <rect class="panel" x="1020" y="130" width="420" height="1030" />
  <text class="sectionTitle" x="1050" y="170">External gates and delivery</text>
  <text class="subtitle" x="1050" y="195">Outbox, RabbitMQ, review, retry scheduler</text>

  <!-- Job states -->
  <rect class="state" x="105" y="250" width="250" height="82" fill="#e0f2fe" stroke="#38bdf8" />
  <text class="stateTitle" x="128" y="282">Job: PENDING</text>
  <text class="stateText" x="128" y="307">created by JobService</text>

  <rect class="state" x="105" y="410" width="250" height="104" fill="#dcfce7" stroke="#22c55e" />
  <text class="stateTitle" x="128" y="443">Job: PROCESSING</text>
  <text class="stateText" x="128" y="468">worker marks current stage</text>
  <text class="stateText" x="128" y="490">current_stage = message.stage</text>

  <rect class="state" x="105" y="720" width="250" height="104" fill="#fee2e2" stroke="#ef4444" />
  <text class="stateTitle" x="128" y="753">Job: FAILED</text>
  <text class="stateText" x="128" y="778">retry attempts exhausted</text>
  <text class="stateText" x="128" y="800">stage moved to DLQ</text>

  <rect class="state" x="105" y="955" width="250" height="104" fill="#dcfce7" stroke="#16a34a" />
  <text class="stateTitle" x="128" y="988">Job: COMPLETED</text>
  <text class="stateText" x="128" y="1013">render has no next stage</text>
  <text class="stateText" x="128" y="1035">progress = pipeline completed</text>

  <!-- Stage execution states -->
  <rect class="state" x="590" y="250" width="300" height="96" fill="#fef3c7" stroke="#f59e0b" />
  <text class="stateTitle" x="615" y="283">Message queued</text>
  <text class="stateText" x="615" y="308">OutboxEvent.status = pending</text>
  <text class="stateText" x="615" y="330">RabbitMQ receives payload</text>

  <rect class="state" x="590" y="420" width="300" height="108" fill="#ede9fe" stroke="#8b5cf6" />
  <text class="stateTitle" x="615" y="453">Execution: PROCESSING</text>
  <text class="stateText" x="615" y="478">dedupe_key checked</text>
  <text class="stateText" x="615" y="500">locked_at = now</text>

  <rect class="state" x="590" y="610" width="300" height="116" fill="#e9d5ff" stroke="#9333ea" />
  <text class="stateTitle" x="615" y="643">Handler result</text>
  <text class="stateText" x="615" y="668">result_payload + _logs</text>
  <text class="stateText" x="615" y="690">may include pause=true</text>
  <text class="stateText" x="615" y="712">may include artifact_uri</text>

  <rect class="state" x="590" y="805" width="300" height="106" fill="#dcfce7" stroke="#22c55e" />
  <text class="stateTitle" x="615" y="838">Execution: COMPLETED</text>
  <text class="stateText" x="615" y="863">completed_at = now</text>
  <text class="stateText" x="615" y="885">next stage may be enqueued</text>

  <rect class="state" x="590" y="985" width="300" height="112" fill="#fee2e2" stroke="#ef4444" />
  <text class="stateTitle" x="615" y="1018">Execution: DLQ</text>
  <text class="stateText" x="615" y="1043">max attempts reached</text>
  <text class="stateText" x="615" y="1065">error_message stored</text>
  <text class="stateText" x="615" y="1087">dead-letter message emitted</text>

  <rect class="state" x="590" y="1135" width="300" height="92" fill="#fff7ed" stroke="#fb923c" />
  <text class="stateTitle" x="615" y="1168">RETRY_SCHEDULED</text>
  <text class="stateText" x="615" y="1193">next_retry_at = now + backoff</text>
  <text class="stateText" x="615" y="1215">retry message in result_payload</text>

  <!-- External gates -->
  <rect class="state" x="1080" y="250" width="280" height="96" fill="#ffedd5" stroke="#fb923c" />
  <text class="stateTitle" x="1105" y="283">Outbox dispatch</text>
  <text class="stateText" x="1105" y="308">pending -> published</text>
  <text class="stateText" x="1105" y="330">RabbitMQ delivery starts work</text>

  <rect class="state" x="1080" y="610" width="280" height="128" fill="#fffbeb" stroke="#eab308" />
  <text class="stateTitle" x="1105" y="643">Review pause gate</text>
  <text class="stateText" x="1105" y="668">manual_review pending</text>
  <text class="stateText" x="1105" y="690">translation_review pending</text>
  <text class="stateText" x="1105" y="712">no next stage enqueued</text>

  <rect class="state" x="1080" y="805" width="280" height="110" fill="#ecfccb" stroke="#84cc16" />
  <text class="stateTitle" x="1105" y="838">Approve API</text>
  <text class="stateText" x="1105" y="863">remove pause flags</text>
  <text class="stateText" x="1105" y="885">enqueue translate / render</text>

  <rect class="state" x="1080" y="1030" width="280" height="118" fill="#fef2f2" stroke="#f87171" />
  <text class="stateTitle" x="1105" y="1063">Retry scheduler</text>
  <text class="stateText" x="1105" y="1088">find due retry rows</text>
  <text class="stateText" x="1105" y="1110">restore PipelineStageMessage</text>
  <text class="stateText" x="1105" y="1132">enqueue same stage again</text>

  <!-- Main arrows -->
  <path class="arrow" d="M230 332 L230 410" />
  <text class="label" x="250" y="375">pipeline started</text>

  <path class="arrow" d="M355 462 L590 298" />
  <text class="label" x="395" y="372">enqueue_first_stage</text>

  <path class="arrow" d="M890 298 L1080 298" />
  <text class="label" x="930" y="278">outbox pending</text>

  <path class="arrow" d="M1220 346 L1220 390 C1220 410 930 395 890 474" />
  <text class="label" x="1048" y="398">RabbitMQ consume</text>

  <path class="arrow" d="M740 528 L740 610" />
  <text class="label" x="760" y="574">handler executes</text>

  <path class="arrow" d="M740 726 L740 805" />
  <text class="label" x="760" y="770">success</text>

  <path class="arrow" d="M590 858 C505 858 500 462 355 462" />
  <text class="label" x="410" y="825">each stage updates Job.current_stage</text>

  <path class="arrow" d="M890 858 C995 858 995 298 1080 298" />
  <text class="label" x="945" y="584">next_stage outbox</text>

  <path class="arrow" d="M740 911 L740 985" />
  <text class="label" x="760" y="953">if final failure</text>

  <path class="arrow" d="M590 1040 C430 1040 430 772 355 772" />
  <text class="label" x="405" y="1012">mark job failed</text>

  <path class="arrow" d="M590 858 C468 895 445 1007 355 1007" />
  <text class="label" x="390" y="955">render has no next stage</text>

  <!-- Pause route -->
  <path class="softArrow" d="M890 668 L1080 668" />
  <text class="label" x="932" y="648">pause=true</text>

  <path class="softArrow" d="M1220 738 L1220 805" />
  <path class="softArrow" d="M1080 860 C960 860 970 298 890 298" />
  <text class="label" x="1015" y="825">review approved</text>

  <!-- Retry route -->
  <path class="softArrow" d="M740 726 L740 1135" />
  <text class="label" x="760" y="1124">exception + attempts remain</text>

  <path class="softArrow" d="M890 1180 L1080 1089" />
  <text class="label" x="932" y="1128">next_retry_at due</text>

  <path class="softArrow" d="M1080 1090 C960 1090 950 298 890 298" />

  <!-- Notes -->
  <rect class="note" x="88" y="1110" width="360" height="88" />
  <text class="noteText" x="112" y="1142">Job.status is coarse-grained.</text>
  <text class="noteText" x="112" y="1166">Detailed per-stage state lives in</text>
  <text class="noteText" x="112" y="1190">PipelineStageExecution.</text>

  <rect class="note" x="1018" y="1184" width="380" height="64" />
  <text class="noteText" x="1042" y="1216">RabbitMQ is the normal work source.</text>
  <text class="noteText" x="1042" y="1240">Retry scheduler only re-enqueues delayed attempts.</text>

  <!-- Legend -->
  <text class="legendText" x="70" y="1248">Solid arrows: normal success path. Dashed arrows: pause/resume and retry paths. OutboxEvent tracks delivery intent; PipelineStageExecution tracks execution result.</text>
</svg>
