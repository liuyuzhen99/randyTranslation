name: Backend CI and Images

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: liuyuzhen99

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: randy_translation
          POSTGRES_USER: randy
          POSTGRES_PASSWORD: randy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U randy -d randy_translation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
      qdrant:
        image: qdrant/qdrant:v1.12.6
        ports:
          - 6333:6333
    env:
      JOB_REPOSITORY_BACKEND: sqlalchemy
      DATABASE_URL: postgresql+psycopg://randy:randy@127.0.0.1:5432/randy_translation
      SHADOW_WRITE_ENABLED: "false"
      DATABASE_AUTO_CREATE_SCHEMA: "true"
      DUAL_WRITE_RECONCILE_ENABLED: "false"
      OUTBOX_DISPATCH_ENABLED: "true"
      ASYNC_PIPELINE_ENABLED: "true"
      PIPELINE_SERVICE_WORKER_ENABLED: "false"
      RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
      MEDIA_STORAGE_BACKEND: cos
      MEDIA_TEMP_ROOT: /tmp/randy-translation-media/temp
      COS_SECRET_ID: ${{ secrets.CI_COS_SECRET_ID }}
      COS_SECRET_KEY: ${{ secrets.CI_COS_SECRET_KEY }}
      COS_BUCKET: ${{ secrets.CI_COS_BUCKET }}
      COS_REGION: ${{ secrets.CI_COS_REGION }}
      COS_SCHEME: ${{ vars.CI_COS_SCHEME || 'https' }}
      COS_ENDPOINT: ${{ vars.CI_COS_ENDPOINT }}
      VECTOR_REPOSITORY_BACKEND: qdrant
      VECTOR_EMBEDDING_PROVIDER: bge-m3
      VECTOR_EMBEDDING_DIMENSION: "1024"
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_API_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Validate CI environment
        run: |
          test -n "$COS_SECRET_ID"
          test -n "$COS_SECRET_KEY"
          test -n "$COS_BUCKET"
          test -n "$COS_REGION"
          python - <<'PY'
          import os
          from urllib.request import urlopen

          urlopen("http://127.0.0.1:6333/healthz", timeout=10)

          required = {
              "JOB_REPOSITORY_BACKEND": "sqlalchemy",
              "MEDIA_STORAGE_BACKEND": "cos",
              "VECTOR_REPOSITORY_BACKEND": "qdrant",
              "VECTOR_EMBEDDING_PROVIDER": "bge-m3",
          }
          for name, expected in required.items():
              actual = os.environ.get(name)
              if actual != expected:
                  raise SystemExit(f"{name}={actual!r}, expected {expected!r}")
          PY

      - name: Run unit tests
        run: |
          for test_file in test/test_*.py; do
            PYTHONPATH=. python -m unittest discover -s test -p "$(basename "$test_file")"
          done

  publish-images:
    name: Publish ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs: backend-ci
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile.api
          - image: worker
            dockerfile: Dockerfile.worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/randy-translation-${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/randy-translation-${{ matrix.image }}:latest
          cache-from: type=gha,scope=backend-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.image }}
