name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run lint
        run: ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.135.1 starlette==0.52.1 pydantic==2.12.5 uvicorn==0.41.0 httpx==0.28.1

      - name: Run unit tests
        run: PYTHONPATH=. python -m unittest discover -s test -p "test_phase0_config_validation.py"

  integration-test-trigger:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.135.1 starlette==0.52.1 pydantic==2.12.5 uvicorn==0.41.0 httpx==0.28.1

      - name: Run baseline API integration tests
        run: PYTHONPATH=. python -m unittest discover -s test -p "test_phase0_api_baseline.py"
